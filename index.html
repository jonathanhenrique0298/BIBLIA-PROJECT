    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Bíblia para Projeção</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --app-height: 100%;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        -webkit-tap-highlight-color: transparent;
        /* Evita scroll elástico no iOS e comportamento de pull-to-refresh no Android */
        overscroll-behavior-y: contain;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      .font-spartan {
        font-family: 'League Spartan', sans-serif;
      }
      /* Android-specific notch/safe area handling */
      .safe-top {
        padding-top: env(safe-area-inset-top);
      }
      /* Custom scrollbar for a cleaner mobile look */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
    </style>
