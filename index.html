
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    
    <!-- PWA Primary Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bíblia Pro">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3004/3004408.png">
    
    <title>Bíblia para Projeção</title>
    
    <!-- Scripts Necessários -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
      :root { --app-height: 100%; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
      }
      #root { height: 100%; width: 100%; }
      .font-spartan { font-family: 'League Spartan', sans-serif; }
      .safe-top { padding-top: env(safe-area-inset-top); }
      
      /* Ocultar scrollbars mas manter funcionalidade */
      ::-webkit-scrollbar { width: 0px; background: transparent; }
      
      /* Efeito de clique no Android */
      .active-scale:active {
        transform: scale(0.95);
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Script para registrar Service Worker (necessário para PWA/APK-like) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('https://unpkg.com/serviceworker-cache-polyfill@4.0.0/index.js')
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>

    <script type="text/babel" data-type="module" src="index.tsx"></script>
  </body>
</html>
